<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuggets</title>
<style>
  :root {
    --bg: #101114; --card: #1a1c21; --card2: #22252c; --line: #2c3038;
    --ink: #e8e8e6; --dim: #9a9da5; --faint: #6b6f78;
    --accent: #5aa8f0; --gold: #e0b34e; --good: #6fc48d;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-bottom: 40px;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 8px 10px 6px;
  }
  .modes { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .modes button {
    flex: none; border: 1px solid var(--line); background: var(--card);
    color: var(--dim); border-radius: 16px; padding: 6px 14px; font-size: 14px;
  }
  .modes button.on { background: var(--accent); border-color: var(--accent); color: #08131f; font-weight: 600; }
  .filters { display: flex; gap: 6px; margin-top: 6px; overflow-x: auto; }
  .filters select {
    flex: none; background: var(--card); color: var(--dim);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font-size: 13px;
    max-width: 40vw;
  }
  .filters button {
    flex: none; background: var(--card); color: var(--dim);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 13px;
  }
  .filters button.on { color: var(--accent); border-color: var(--accent); }
  #count { font-size: 12px; color: var(--faint); margin-top: 5px; }
  #status { font-size: 12px; margin-top: 4px; display: none; }
  #status.quiet { display: block; color: var(--good); }
  #status.alarm { display: block; color: #e0704e; font-weight: 600; }
  #status .p-blue { color: var(--accent); }  #status .p-green { color: var(--good); }
  #status .p-yellow { color: var(--gold); }  #status .p-red { color: #e0704e; }
  main { padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; max-width: 760px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px;
  }
  .card.watched { opacity: 0.55; }
  .card.hot1 { border-left: 4px solid var(--good); }
  .card.hot2 { border-left: 4px solid var(--gold); }
  .hl { font-weight: 600; cursor: pointer; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--dim); }
  .chip { background: var(--card2); border-radius: 10px; padding: 1px 8px; }
  .score { font-variant-numeric: tabular-nums; }
  .score.p { color: var(--accent); }
  .score.e { color: var(--gold); }
  .body { display: none; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .card.open .body { display: block; }
  .content { white-space: pre-wrap; }
  .rationale { margin-top: 8px; font-size: 15px; color: var(--gold); }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .watch {
    display: inline-block; background: var(--accent); color: #08131f;
    border-radius: 8px; padding: 8px 14px; text-decoration: none; font-weight: 600; font-size: 14px;
  }
  .stars { display: flex; gap: 2px; }
  .stars button {
    background: none; border: none; font-size: 24px; color: var(--faint);
    padding: 2px 4px; line-height: 1;
  }
  .stars button.lit { color: var(--gold); }
  .chip.res { font-size: 14px; color: var(--gold); }
  .gstars button { font-size: 20px; padding: 2px 3px; }
  .wtoggle {
    background: var(--card2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; padding: 7px 12px; font-size: 13px;
  }
  .wtoggle.on { color: var(--good); border-color: var(--good); }
  .rnote { margin-top: 8px; font-size: 12px; color: var(--faint); }
  .ghead {
    background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px;
  }
  .ghead .gtitle { font-weight: 600; cursor: pointer; }
  .ghead .ytitle { margin-top: 2px; font-size: 13px; color: var(--ink); }
  .gmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 5px; font-size: 12px; color: var(--dim); }
  .gwatch { padding: 5px 10px; font-size: 13px; }
  .wtoggle.gwt { padding: 5px 10px; }
  .gcards {
    display: flex; flex-direction: column; gap: 6px;
    margin-left: 10px; border-left: 2px solid var(--line); padding-left: 8px;
  }
  .empty { color: var(--faint); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <div class="modes" id="modes"></div>
  <div class="filters">
    <select id="fChannel"><option value="">channel</option></select>
    <select id="fDomain"><option value="">domain</option></select>
    <select id="fType"><option value="">type</option></select>
    <select id="fAge">
      <option value="">any age</option>
      <option value="2">&#8804; 2 days</option>
      <option value="10">&#8804; 10 days</option>
      <option value="60">&#8804; 2 months</option>
      <option value="180">&#8804; 6 months</option>
      <option value="365">&#8804; 1 year</option>
    </select>
    <button id="gToggle" title="group nuggets by video">by video</button>
    <button id="zoomOut" title="smaller text">A&#8722;</button>
    <button id="zoomIn" title="larger text">A+</button>
    <select id="fState">
      <option value="open">open</option>
      <option value="">any state</option>
      <option value="unrated">unrated</option>
      <option value="unwatched">unwatched</option>
      <option value="watched">watched</option>
    </select>
  </div>
  <div id="count"></div>
  <div id="status"></div>
</header>
<main id="list"><div class="empty">Loading…</div></main>
<script>
// Static shell (GitHub Pages). All data comes from the key-gated Supabase
// function below; the key lives only in the bookmark's ?key= parameter.
const BASE = "https://zowilxlpldqxtotrvekd.supabase.co/functions/v1/yt-review";
const KEY = new URLSearchParams(location.search).get("key");
const MODES = [["comfort","Comfort"],["stretch","Stretch"],["newest","Newest"],["queue","Queue"],["prospect","Prospect"]];
// yt_nuggets.rating column comment is the source of truth for this scale.
const SCALE = { 1: "never gonna look (deleted after a day)", 2: "unlikely to use",
  3: "neutral / did not regret", 4: "good", 5: "outstanding" };
let all = [], slope = 0, intercept = 0;
let manualEmpty = []; // manual adds analyzed with zero nuggets — honest feedback
let channelHype = new Map(); // label -> avg hype level, from the review payload
let state = Object.assign(
  { mode: "comfort", channel: "", domain: "", type: "", vstate: "open", age: "", group: true },
  JSON.parse(localStorage.getItem("ytr") || "{}"));
let openId = null;
let collapsed = new Set(); // collapsed video groups; per page-load, like openId
// Cards mutated while on screen keep their spot (dimmed) even once they stop
// passing the filters, so a rate or watch never yanks the card mid-interaction.
// Cleared on any mode/filter change, so the views stay honest.
let pinned = new Set();

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function save() { localStorage.setItem("ytr", JSON.stringify(state)); }
function fmtT(s) { return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function fmtD(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function residual(n) { return n.expert_score - (intercept + slope * n.personal_score); }

function regress() {
  const pts = all.filter(n => n.personal_score != null && n.expert_score != null);
  const N = pts.length;
  if (N < 3) { slope = 0; intercept = 0; return; }
  let sx=0, sy=0, sxx=0, sxy=0;
  for (const n of pts) { sx+=n.personal_score; sy+=n.expert_score;
    sxx+=n.personal_score*n.personal_score; sxy+=n.personal_score*n.expert_score; }
  const denom = N*sxx - sx*sx;
  slope = denom ? (N*sxy - sx*sy) / denom : 0;
  intercept = (sy - slope*sx) / N;
}

function visible() {
  // "open" = still actionable: not yet both rated and watched, and not
  // dismissed with a low rating (1-2 hides it, watched or not).
  // Prospect quarantine: campaign nuggets appear ONLY in Prospect mode —
  // separated by provenance (keyword-mined vs subscribed/manual), never by
  // any quality judgment; nuggets are rated on merit.
  const pass = (n) =>
    (state.mode === "prospect" ? n.campaignId != null : n.campaignId == null) &&
    (!state.channel || n.channelLabel === state.channel) &&
    (!state.domain || n.domain === state.domain) &&
    (!state.type || n.nugget_type === state.type) &&
    (!state.age || Date.now() - new Date(n.publishedAt || n.created_at) <= state.age * 86400000) &&
    (state.vstate !== "open" ||
      ((n.rating == null || !n.watched_at) && !(n.rating != null && n.rating <= 2))) &&
    (state.vstate !== "unrated" || n.rating == null) &&
    (state.vstate !== "unwatched" || !n.watched_at) &&
    (state.vstate !== "watched" || n.watched_at) &&
    (state.mode !== "queue" || (n.rating >= 4 && !n.watched_at));
  const v = all.filter(n => pass(n) || pinned.has(n.id));
  if (state.mode === "queue") {
    v.sort((a,b) => (b.rating - a.rating) || (b.personal_score - a.personal_score));
  } else if (state.mode === "comfort" || state.mode === "prospect") {
    v.sort((a,b) => b.personal_score - a.personal_score);
  } else if (state.mode === "stretch") {
    v.sort((a,b) => residual(b) - residual(a));
  } else {
    v.sort((a,b) => new Date(b.publishedAt || b.created_at) - new Date(a.publishedAt || a.created_at));
  }
  return v;
}

function render() {
  document.getElementById("modes").innerHTML = MODES.map(([id, label]) =>
    '<button class="' + (state.mode === id ? "on" : "") + '" onclick="setMode(\'' + id + '\')">' + label + "</button>"
  ).join("");
  const v = visible();
  document.getElementById("count").textContent =
    v.length + " nuggets" + (state.mode === "stretch" ? " — sorted by how much the mentor disagrees with your taste"
      : state.mode === "prospect" ? " — keyword prospects: rate what you'd actually watch" : "") +
    " · edge stripe = " + (stripeDim() === "personal" ? "your taste" : "mentor") + " score (green 75+, gold 85+)";
  document.getElementById("gToggle").className = state.group ? "on" : "";
  const list = document.getElementById("list");
  const me = manualEmptyHtml();
  if (!v.length) { list.innerHTML = me + '<div class="empty">Nothing here.</div>'; return; }
  list.innerHTML = me + (state.group ? grouped(v) : v.map(card).join(""));
}

// Manual adds that were analyzed and produced ZERO nuggets. You explicitly
// asked for the analysis, so the answer is shown even when it's "nothing
// worth keeping" — the only honest feedback signal on the extractor.
// Manual sources only; the archive's misses would drown the view.
function manualEmptyHtml() {
  if (!manualEmpty.length || state.mode === "prospect") return "";
  const rows = manualEmpty.map(v => {
    const label = v.yt_channels?.label || "?";
    const link = v.url || "https://www.youtube.com/watch?v=" + v.video_id;
    const verdict = v.status === "processed" ? "analyzed — no nuggets found"
      : v.status === "no_transcript" ? "no transcript available"
      : "failed: " + esc((v.error_detail || v.status).slice(0, 80));
    return '<div style="margin-top:4px">' +
      '<a href="' + esc(link) + '" target="_blank" rel="noopener" style="color:var(--ink)">' +
      esc(v.plain_title || v.title || v.video_id) + "</a>" +
      ' <span style="color:var(--faint)">· ' + esc(label) + " · " + verdict + "</span></div>";
  });
  return '<div class="card" style="border-left:4px solid var(--faint)">' +
    '<div style="font-size:12.5px;color:var(--dim)"><b>Your manual adds — ' +
    manualEmpty.length + " with nothing to show</b> (you asked, so here's the answer)</div>" +
    rows.join("") + "</div>";
}

// Group multi-nugget videos under a header; singletons stay plain cards.
// Group order = first appearance in the mode-sorted list (best nugget leads);
// within a group, nuggets run in timestamp order — the video's storyline.
function grouped(v) {
  const byVid = new Map();
  for (const n of v) {
    if (!byVid.has(n.video_id)) byVid.set(n.video_id, []);
    byVid.get(n.video_id).push(n);
  }
  const out = [], done = new Set();
  for (const n of v) {
    if (done.has(n.video_id)) continue;
    done.add(n.video_id);
    const g = byVid.get(n.video_id);
    if (g.length === 1) { out.push(card(n)); continue; }
    out.push(ghead(n, g));
    if (!collapsed.has(n.video_id)) {
      const items = g.slice().sort((a, b) => (a.start_seconds ?? 1e9) - (b.start_seconds ?? 1e9));
      out.push('<div class="gcards">' + items.map(card).join("") + "</div>");
    }
  }
  return out.join("");
}

function fmtDur(s) {
  const m = Math.round(s / 60);
  return m >= 60 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : m + " min";
}

function ghead(n, g) {
  const isC = collapsed.has(n.video_id);
  const dur = n.durationSeconds ? " in " + fmtDur(n.durationSeconds) : "";
  // Header stars light up to the group's lowest rating (unrated counts as 0),
  // so a fully-rated group reads at a glance and a mixed one stays dark.
  const gmin = Math.min(...g.map(x => x.rating || 0));
  const allW = g.every(x => x.watched_at);
  // Humble title leads: the processor's plain_title when scored, else the lead
  // nugget's headline (pre-hype videos). The channel's verbatim title sits
  // below it — full contrast, just smaller — with its hype level as a chip.
  const humble = n.plainTitle || n.headline || n.videoTitle || n.channelLabel;
  const hype = n.hypeLevel != null
    ? '<span class="chip">hype ' + (n.hypeLevel > 0 ? "+" : "") + n.hypeLevel + "</span>" : "";
  return '<div class="ghead">' +
    '<div class="gtitle" onclick="toggleGroup(\'' + n.video_id + '\')">' +
      (isC ? "&#9656; " : "&#9662; ") + esc(humble) + "</div>" +
    (n.videoTitle && n.videoTitle !== humble
      ? '<div class="ytitle">' + esc(n.videoTitle) + "</div>" : "") +
    '<div class="gmeta">' +
      "<b>" + esc(n.channelLabel) + "</b>" +
      "<span>" + fmtD(n.publishedAt || n.created_at) + "</span>" +
      '<span class="chip">' + g.length + " nuggets" + dur + "</span>" + hype +
      '<div class="stars gstars">' + [1,2,3,4,5].map(k =>
        '<button title="' + k + ' — ' + SCALE[k] + ' (rates every unrated nugget; re-tap corrects a uniformly rated group)" class="' +
          (gmin >= k ? "lit" : "") + '" onclick="rateAll(\'' + n.video_id + '\',' + k + ')">&#9733;</button>'
      ).join("") + "</div>" +
      '<a class="watch gwatch" target="_blank" rel="noopener" href="' +
        (n.source === "substack" ? esc(n.contentUrl || "#") : "https://www.youtube.com/watch?v=" + n.video_id) +
        '" onclick="watchAllClick(\'' + n.video_id + '\')">' +
        (n.source === "substack" ? "&#128214; Read now" : "&#9654; Watch now") + "</a>" +
      '<button class="wtoggle gwt' + (allW ? " on" : "") + '" onclick="watchedAll(\'' + n.video_id + '\')">' +
        (allW ? (n.source === "substack" ? "seen" : "watched") + " &#10003;"
              : "mark " + (n.source === "substack" ? "seen" : "watched")) + "</button>" +
    "</div></div>";
}

function toggleGroup(vid) {
  collapsed.has(vid) ? collapsed.delete(vid) : collapsed.add(vid);
  render();
}

// Header watched-toggle: when everything is already watched, a tap
// un-watches the whole group (mis-tap undo); otherwise it marks the
// stragglers watched without opening the video (seen it elsewhere).
async function watchedAll(vid) {
  const g = all.filter(x => x.video_id === vid);
  const allW = g.every(x => x.watched_at);
  const targets = allW ? g : g.filter(x => !x.watched_at);
  const ts = new Date().toISOString();
  for (const n of targets) { n.watched_at = allW ? null : ts; pinned.add(n.id); }
  render();
  for (const n of targets) await post("/watched", { id: n.id, watched: !allW });
}

// Header Watch covers every nugget's timestamp, so mark the whole group
// watched (pinned in place; per-card toggles undo any of them).
async function watchAllClick(vid) {
  const group = all.filter(x => x.video_id === vid && !x.watched_at);
  if (!group.length) return;
  const ts = new Date().toISOString();
  for (const n of group) { n.watched_at = ts; pinned.add(n.id); }
  setTimeout(render, 0);
  for (const n of group) await post("/watched", { id: n.id, watched: true });
}

// Header stars rate every *unrated* nugget in the group; mixed individual
// ratings are never overwritten. But a group carrying ONE uniform rating —
// the result of a previous header tap — stays correctable from the header:
// a different star re-rates the lot, the same star clears it (mirroring
// per-card stars). 4-5 queues the lot; 1-2 closes it out under "open".
async function rateAll(vid, k) {
  const g = all.filter(x => x.video_id === vid);
  let targets = g.filter(x => x.rating == null);
  let next = k;
  if (!targets.length) {
    const first = g[0] && g[0].rating;
    if (!g.every(x => x.rating === first)) return; // mixed: hands off
    targets = g;
    next = first === k ? null : k;
  }
  for (const n of targets) n.rating = next;
  render();
  for (const n of targets) await post("/rate", { id: n.id, rating: next });
}

// Second-dimension stripe: the sort order carries one score, the colored
// left edge carries the one it ISN'T showing — so skimming any sorted list
// still catches standouts on the other axis (green >=75, gold >=85; no
// stripe for the ordinary, which is what makes the rare ones pop).
function stripeDim() {
  return (state.mode === "stretch") ? "personal" : "expert";
}
function stripeClass(n) {
  const s = stripeDim() === "personal" ? n.personal_score : n.expert_score;
  return s >= 85 ? " hot2" : s >= 75 ? " hot1" : "";
}

function card(n) {
  const open = n.id === openId;
  // Verb pair follows the source: watch/watched for video, read/seen for posts.
  const isPost = n.source === "substack";
  const doneWord = isPost ? "seen" : "watched";
  const link = isPost ? (n.contentUrl || "#")
    : "https://www.youtube.com/watch?v=" + n.video_id +
      (n.start_seconds != null ? "&t=" + n.start_seconds + "s" : "");
  const watchLabel = isPost ? "&#128214; Read now"
    : n.start_seconds != null ? "&#9654; Watch at " + fmtT(n.start_seconds) : "&#9654; Watch now";
  const res = state.mode === "stretch"
    ? ' <span class="chip res">mentor +' + residual(n).toFixed(0) + "</span>" : "";
  return '<div class="card' + (open ? " open" : "") + (n.watched_at ? " watched" : "") + stripeClass(n) + '">' +
    '<div class="hl" onclick="toggle(\'' + n.id + '\')">' + esc(n.headline || n.content.slice(0, 110)) + "</div>" +
    '<div class="meta">' +
      "<b>" + esc(n.channelLabel) + "</b>" +
      "<span>" + fmtD(n.publishedAt || n.created_at) + "</span>" +
      (n.domain ? '<span class="chip">' + esc(n.domain) + "</span>" : "") +
      (n.nugget_type ? '<span class="chip">' + esc(n.nugget_type) + "</span>" : "") +
      (isPost ? '<span class="chip">substack</span>' : "") +
      (n.sourceKey && n.sourceKey.endsWith("_manual")
        ? '<span class="chip" style="color:var(--accent)">manual add</span>' : "") +
      '<span class="score p">P' + Math.round(n.personal_score) + "</span>" +
      '<span class="score e">E' + Math.round(n.expert_score) + "</span>" + res +
      (n.rating ? '<span class="chip" style="color:var(--gold)">&#9733;' + n.rating + "</span>" : "") +
    "</div>" +
    '<div class="body">' +
      '<div class="content">' + esc(n.content) + "</div>" +
      (n.rationale ? '<div class="rationale">' + esc(n.rationale) + "</div>" : "") +
      '<div class="actions">' +
        '<a class="watch" target="_blank" rel="noopener" href="' + link + '" onclick="watchClick(\'' + n.id + '\')">' + watchLabel + "</a>" +
        '<div class="stars">' + [1,2,3,4,5].map(k =>
          '<button title="' + k + ' — ' + SCALE[k] + '" class="' + (n.rating >= k ? "lit" : "") + '" onclick="rate(\'' + n.id + '\',' + k + ')">&#9733;</button>'
        ).join("") + "</div>" +
        '<button class="wtoggle' + (n.watched_at ? " on" : "") + '" onclick="watched(\'' + n.id + '\')">' +
          (n.watched_at ? doneWord + " &#10003;" : "mark " + doneWord) + "</button>" +
      "</div>" +
      '<div class="rnote">' + rnote(n) + "</div>" +
    "</div></div>";
}

// Legend under the stars: before watching the stars rate the nugget (the
// abstract); after watching, the same stars become the video rating.
function rnote(n) {
  // Campaign nuggets carry the standing reminder: stars keep ONE meaning
  // everywhere — "I intend to watch this" — and ratings feed the campaign's
  // per-query yield stats.
  const pre = n.campaignId ? "prospect &middot; stars = would you actually watch it &middot; ratings teach the campaign<br>" : "";
  if (!n.rating) {
    return pre + (n.watched_at
      ? "watched — rate the video to close it out"
      : "stars rate the nugget &middot; 4&ndash;5 queues it &middot; re-rate after watching");
  }
  return pre + "&#9733;" + n.rating + " &mdash; " + SCALE[n.rating] +
    (n.rating >= 4 && !n.watched_at ? " &middot; in queue" : "");
}

function setMode(m) { pinned.clear(); state.mode = m; save(); render(); }
function toggle(id) { openId = openId === id ? null : id; render(); }

// A failed save must never look like a successful one: any non-OK response
// or network failure announces itself instead of silently dropping the write.
async function post(path, body) {
  try {
    const res = await fetch(BASE + path + "?key=" + encodeURIComponent(KEY), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
  } catch (e) {
    alert("NOT SAVED (" + path + "): " + e.message +
      "\nThe change you just made was not stored - reload and retry.");
  }
}
async function rate(id, k) {
  const n = all.find(x => x.id === id);
  const next = n.rating === k ? null : k; // tap the same star again to clear
  n.rating = next; pinned.add(id); render();
  await post("/rate", { id, rating: next });
}
async function watched(id) {
  const n = all.find(x => x.id === id);
  n.watched_at = n.watched_at ? null : new Date().toISOString();
  pinned.add(id); render();
  await post("/watched", { id, watched: !!n.watched_at });
}
// The Watch link also marks the nugget watched. The re-render is deferred a
// tick — replacing the anchor mid-click would cancel the new-tab navigation.
async function watchClick(id) {
  const n = all.find(x => x.id === id);
  if (n.watched_at) return; // already watched: just follow the link
  n.watched_at = new Date().toISOString();
  pinned.add(id);
  setTimeout(render, 0);
  await post("/watched", { id, watched: true });
}

// Pace = (used/quota) / elapsed-fraction, colored like the ops burn cards;
// each meter names its limiter in a couple of words.
function paceHtml(used, quota, elapsed, limiter) {
  if (!quota || !elapsed) return "";
  const r = (used / quota) / Math.max(elapsed, 0.02);
  const cls = r < 0.5 ? "p-blue" : r <= 1 ? "p-green" : r <= 1.3 ? "p-yellow" : "p-red";
  return ' <span class="' + cls + '">' + r.toFixed(1) + "&times; pace</span> <span style=\"opacity:.75\">(" + limiter + ")</span>";
}

function renderStatus(s) {
  const el = document.getElementById("status");
  if (!s) return;
  if (s.alarms && s.alarms.length) {
    el.className = "alarm";
    el.textContent = "⚠ " + s.alarms.join(" · ");
  } else {
    const bits = [];
    if (s.mtd_cost_usd != null) {
      const d = new Date();
      const monthFrac = d.getDate() / new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      bits.push("$" + Number(s.mtd_cost_usd).toFixed(2) +
        paceHtml(Number(s.mtd_cost_usd), s.claude_budget_usd, monthFrac, "soft $ budget"));
    }
    if (s.supadata) {
      bits.push("pulls " + s.supadata.mtd_calls + "/" + s.supadata.allotment +
        paceHtml(s.supadata.mtd_calls, s.supadata.allotment, s.supadata.cycle_fraction, "Supadata cycle"));
    }
    if (s.drift && s.drift.detail) bits.push(s.drift.breach ? "drift: watch" : "drift ok");
    if (!bits.length) return;
    el.className = "quiet";
    el.innerHTML = "✓ " + bits.join(" &nbsp;·&nbsp; ");
  }
}

// Text size in ~20% steps, persisted like every other viewer setting.
function applyZoom() {
  document.body.style.zoom = state.zoom || 1;
}
function zoomStep(dir) {
  const z = (state.zoom || 1) * (dir > 0 ? 1.2 : 1 / 1.2);
  state.zoom = Math.round(Math.min(2.5, Math.max(0.58, z)) * 100) / 100;
  save(); applyZoom();
}

function bindFilter(sel, prop) {
  const el = document.getElementById(sel);
  el.value = state[prop] || "";
  el.onchange = () => { pinned.clear(); state[prop] = el.value; save(); render(); };
}

async function load() {
  if (!KEY) {
    document.getElementById("list").innerHTML =
      '<div class="empty">Missing ?key= in the URL — open this page from your bookmark.</div>';
    return;
  }
  let res;
  try {
    res = await fetch(BASE + "/data?key=" + encodeURIComponent(KEY));
  } catch (e) {
    document.getElementById("list").innerHTML = '<div class="empty">Could not reach the nugget API.</div>';
    return;
  }
  if (!res.ok) {
    document.getElementById("list").innerHTML =
      '<div class="empty">API error ' + res.status + (res.status === 401 ? " — key rejected." : "") + "</div>";
    return;
  }
  const data = await res.json();
  renderStatus(data.status);
  manualEmpty = data.manual_empty || [];
  all = (data.nuggets || []).map(n => ({
    ...n,
    channelLabel: n.yt_videos?.yt_channels?.label || n.yt_videos?.channel_id || "?",
    videoTitle: n.yt_videos?.title || "",
    plainTitle: n.yt_videos?.plain_title || "",
    hypeLevel: n.yt_videos?.hype_level ?? null,
    campaignId: n.yt_videos?.campaign_id ?? null,
    source: n.yt_videos?.source || "youtube",
    sourceKey: n.yt_videos?.source_key || null,
    contentUrl: n.yt_videos?.url || null,
    publishedAt: n.yt_videos?.published_at,
    durationSeconds: n.yt_videos?.duration_seconds ?? null,
  }));
  channelHype = new Map((data.channel_hype || []).map(c => [c.label, c.avg_hype]));
  regress();
  const fill = (sel, values, label) => {
    const el = document.getElementById(sel);
    [...new Set(values.filter(Boolean))].sort().forEach(vv => {
      const o = document.createElement("option"); o.value = vv;
      o.textContent = label ? label(vv) : vv; el.appendChild(o);
    });
  };
  // Channel options carry the running hype average — the weeding signal.
  fill("fChannel", all.map(n => n.channelLabel), (vv) => {
    const h = channelHype.get(vv);
    return h == null ? vv : vv + " (" + (h > 0 ? "+" : "") + Number(h).toFixed(1) + ")";
  });
  fill("fDomain", all.map(n => n.domain));
  fill("fType", all.map(n => n.nugget_type));
  bindFilter("fChannel", "channel");
  bindFilter("fDomain", "domain");
  bindFilter("fType", "type");
  bindFilter("fState", "vstate");
  bindFilter("fAge", "age");
  document.getElementById("gToggle").onclick = () => {
    state.group = !state.group; save(); render();
  };
  document.getElementById("zoomIn").onclick = () => zoomStep(1);
  document.getElementById("zoomOut").onclick = () => zoomStep(-1);
  applyZoom();
  render();
}
load();
</script>
</body>
