<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Nugget lists</title>
<!-- The lists (Audio / Video / Read) are a MODE of the viewer since
     2026-08-23 (viewer-spec §13): same widgets, same sort, the player bar
     appears when the Listed dropdown selects a list. This stub forwards old
     links into the viewer with the Audio list preselected; the key travels
     in the query string. -->
<script>
  const q = new URLSearchParams(location.search);
  if (!q.get("listed")) q.set("listed", "audio");
  location.replace("index.html?" + q.toString() + location.hash);
</script>
</head><body style="background:#101114;color:#9a9da5;font:15px system-ui;padding:20px">
<a href="index.html?listed=audio" style="color:#5aa8f0">The lists moved into the viewer — tap to continue.</a>
</body></html>
