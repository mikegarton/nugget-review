<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nugget clips</title>
<style>
  :root {
    --bg: #101114; --card: #1a1c21; --card2: #22252c; --line: #2c3038;
    --ink: #e8e8e6; --dim: #9a9da5; --faint: #6b6f78;
    --accent: #5aa8f0; --gold: #e0b34e; --good: #6fc48d;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: 40px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 8px 10px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar h1 { font-size: 16px; font-weight: 600; flex: 1 1 auto; }
  button { background: var(--card); color: var(--ink); border: 1px solid var(--line);
           border-radius: 10px; padding: 8px 14px; font-size: 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08131f; font-weight: 600; }
  button:disabled { opacity: .45; }
  #count { font-size: 12px; color: var(--faint); margin-top: 5px; }
  main { padding: 8px 10px; max-width: 760px; margin: 0 auto; }
  /* 16:9 player box; the IFrame API replaces #player with the iframe. */
  .pbox { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 10px; overflow: hidden; }
  .pbox iframe, .pbox #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #now { margin-top: 8px; font-size: 13px; color: var(--dim); min-height: 1.4em; }
  .list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .item.now { border-color: var(--accent); }
  .item.done { opacity: .5; }
  .item .h { font-weight: 600; }
  .item .m { font-size: 12px; color: var(--dim); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { color: var(--faint); text-align: center; padding: 40px 0; }
  /* Pocket guard: after Start, a full-screen overlay swallows touches; a
     1.5 s long-press unlocks. Audio keeps playing underneath. */
  #lock { position: fixed; inset: 0; z-index: 50; background: rgba(8,9,12,.92); display: none;
          align-items: center; justify-content: center; text-align: center; color: var(--dim);
          font-size: 14px; padding: 30px; touch-action: none; user-select: none; }
  #lock.on { display: flex; }
  #lock b { color: var(--ink); display: block; font-size: 18px; margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Nugget clips</h1>
    <button id="prev" title="previous clip">&#9664;</button>
    <button id="start" class="primary">&#9654; Start</button>
    <button id="next" title="next clip">&#9654;&#9654;</button>
    <button id="lockBtn" title="pocket guard: swallow touches until a long-press">&#128274;</button>
  </div>
  <div id="count"></div>
</header>
<main>
  <div class="pbox"><div id="player"></div></div>
  <div id="now"></div>
  <div class="list" id="list"><div class="empty">Loading…</div></div>
</main>
<div id="lock"><div><b>locked</b>audio keeps playing — press and hold 1.5 s to unlock</div></div>
<script>
// Clip player page (viewer-spec draft 6 §10, option B — Mike 2026-08-22):
// one tap, then the phone goes in the pocket. Plays the Q-badged (queued)
// nuggets as clips back-to-back in an embedded YouTube player, chaining
// loadVideoById({startSeconds, endSeconds}) on the ENDED event. Same key
// logic as index.html (?key= once, then localStorage cr_review_key).
// Acceptance (spec §10.2): on the phone, ONE tap on Start must carry into the
// second clip with no touch. Embedded playback pauses when the screen locks
// (that is why the wake lock + pocket guard exist); Media Session handlers
// are best-effort — the embed's own media session may win on some devices.
const BASE = "https://zowilxlpldqxtotrvekd.supabase.co/functions/v1/yt-review";
const urlKey = new URLSearchParams(location.search).get("key");
if (urlKey) localStorage.setItem("cr_review_key", urlKey);
const KEY = urlKey || localStorage.getItem("cr_review_key");
const END_MARGIN = 30; // same display clamp as the viewer (spec §7.2)

let clips = [];      // [{id, videoId, title, channel, start, end, headline}]
let idx = -1;        // current clip index
let player = null, apiReady = false, wakeLock = null, clipLen = 120;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtT(s) { return Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0"); }
function displayStart(start, duration) {
  if (start == null) return 0;
  if (!duration) return start;
  return Math.max(0, Math.min(start, duration - END_MARGIN));
}

// List = queued, youtube, not pickled, current generation (the payload is
// current-generation only). Order: videos by newest queued_at first (Date-Q
// desc), clips inside a video in storyline order (start asc). Clip end = the
// next queued clip's start in the same video when later, else start +
// clip_default_seconds — capped at the video's duration. (Accepted 2026-08-22.)
function buildClips(data) {
  clipLen = Number(data.clip_default_seconds) || 120;
  // Normalized payload (2026-08-23): video metadata in data.videos by
  // video_id; the per-nugget embed tolerated as a fallback.
  const videos = data.videos || {};
  for (const n of data.nuggets || []) if (!n.yt_videos) n.yt_videos = videos[n.video_id] || null;
  const rows = (data.nuggets || []).filter(n =>
    n.queued_at && (n.yt_videos?.source || "youtube") === "youtube" && !(n.rating != null && n.rating <= 2));
  const byVid = new Map();
  for (const n of rows) {
    if (!byVid.has(n.video_id)) byVid.set(n.video_id, []);
    byVid.get(n.video_id).push(n);
  }
  const vids = [...byVid.entries()].map(([vid, ns]) => ({
    vid, ns, latestQ: Math.max(...ns.map(n => new Date(n.queued_at).getTime())),
  })).sort((a, b) => b.latestQ - a.latestQ);
  const out = [];
  for (const { vid, ns } of vids) {
    const v = ns[0].yt_videos || {};
    const dur = v.duration_seconds || null;
    const ordered = ns.map(n => ({ n, start: displayStart(n.start_seconds, dur) }))
      .sort((a, b) => a.start - b.start);
    ordered.forEach((o, i) => {
      const nextStart = i + 1 < ordered.length ? ordered[i + 1].start : null;
      let end = (nextStart != null && nextStart > o.start) ? nextStart : o.start + clipLen;
      if (dur) end = Math.min(end, dur);
      out.push({
        id: o.n.id, videoId: vid,
        title: v.plain_title || v.title || vid,
        channel: v.yt_channels?.label || "?",
        headline: o.n.headline || (o.n.content || "").slice(0, 100),
        start: o.start, end, dur,
      });
    });
  }
  return out;
}

function renderList() {
  const el = document.getElementById("list");
  if (!clips.length) { el.innerHTML = '<div class="empty">No queued clips — tap Q on nuggets in the viewer first.</div>'; return; }
  el.innerHTML = clips.map((c, i) =>
    '<div class="item' + (i === idx ? " now" : i < idx ? " done" : "") + '" onclick="jump(' + i + ')">' +
      '<div class="h">' + esc(c.headline) + "</div>" +
      '<div class="m"><span>' + esc(c.channel) + "</span><span>" + esc(c.title) + "</span>" +
      "<span>" + fmtT(c.start) + "–" + fmtT(c.end) + "</span></div></div>").join("");
  document.getElementById("count").textContent =
    clips.length + " clips · " + [...new Set(clips.map(c => c.videoId))].length + " videos · default clip " + clipLen + " s";
  const c = clips[idx];
  document.getElementById("now").textContent = c ? ("now: " + c.headline + " — " + c.channel) : "";
  document.getElementById("prev").disabled = idx <= 0;
  document.getElementById("next").disabled = idx < 0 || idx >= clips.length - 1;
}

// ---- YouTube IFrame API --------------------------------------------------
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("player", {
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, autoplay: 0 },
    events: {
      onReady: () => { apiReady = true; document.getElementById("start").disabled = !clips.length; },
      onStateChange: (e) => {
        // 0 = ENDED: endSeconds reached (or the video ended) -> next clip.
        if (e.data === 0) playIndex(idx + 1);
        if (e.data === 1) setMediaSession();
      },
    },
  });
};

function playIndex(i) {
  if (i < 0 || i >= clips.length) { stopAll(); return; }
  idx = i;
  const c = clips[i];
  player.loadVideoById({ videoId: c.videoId, startSeconds: c.start, endSeconds: c.end });
  renderList();
  setMediaSession();
}
function jump(i) { if (apiReady) playIndex(i); }
function stopAll() {
  idx = -1; renderList();
  document.getElementById("now").textContent = "done — every queued clip played";
  releaseWake();
  document.getElementById("lock").className = "";
}

async function requestWake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { /* best effort */ }
}
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && idx >= 0) requestWake();
});

function setMediaSession() {
  if (!("mediaSession" in navigator) || idx < 0) return;
  const c = clips[idx];
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: c.headline, artist: c.channel, album: c.title });
    navigator.mediaSession.setActionHandler("nexttrack", () => playIndex(idx + 1));
    navigator.mediaSession.setActionHandler("previoustrack", () => playIndex(idx - 1));
    navigator.mediaSession.setActionHandler("pause", () => player.pauseVideo());
    navigator.mediaSession.setActionHandler("play", () => player.playVideo());
  } catch (e) { /* best effort */ }
}

// Pocket guard.
const lock = document.getElementById("lock");
let pressTimer = null;
lock.addEventListener("touchstart", () => { pressTimer = setTimeout(() => { lock.className = ""; }, 1500); }, { passive: true });
lock.addEventListener("touchend", () => clearTimeout(pressTimer));
lock.addEventListener("touchcancel", () => clearTimeout(pressTimer));
lock.addEventListener("mousedown", () => { pressTimer = setTimeout(() => { lock.className = ""; }, 1500); });
lock.addEventListener("mouseup", () => clearTimeout(pressTimer));

document.getElementById("start").onclick = () => {
  if (!apiReady || !clips.length) return;
  requestWake();
  playIndex(idx >= 0 ? idx : 0);
  lock.className = "on";
};
document.getElementById("next").onclick = () => playIndex(idx + 1);
document.getElementById("prev").onclick = () => playIndex(idx - 1);
document.getElementById("lockBtn").onclick = () => { lock.className = "on"; };

async function load() {
  if (!KEY) {
    document.getElementById("list").innerHTML =
      '<div class="empty">Missing ?key= in the URL — open the viewer from your bookmark once on this device.</div>';
    return;
  }
  let res;
  try { res = await fetch(BASE + "/data?key=" + encodeURIComponent(KEY)); }
  catch (e) { document.getElementById("list").innerHTML = '<div class="empty">Could not reach the nugget API.</div>'; return; }
  if (!res.ok) {
    document.getElementById("list").innerHTML = '<div class="empty">API error ' + res.status + (res.status === 401 ? " — key rejected." : "") + "</div>";
    return;
  }
  clips = buildClips(await res.json());
  renderList();
  document.getElementById("start").disabled = !apiReady || !clips.length;
}
document.getElementById("start").disabled = true;
load();
</script>
</body>
</html>
