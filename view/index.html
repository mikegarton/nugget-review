<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuggets</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #101114; --card: #1a1c21; --card2: #22252c; --line: #2c3038;
    --ink: #e8e8e6; --dim: #9a9da5; --faint: #6b6f78;
    --accent: #5aa8f0; --gold: #e0b34e; --good: #6fc48d;
    --mint: #7fe3b0; --yellow: #ffd166;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-bottom: 40px;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 6px 10px 6px;
  }
  /* Row 1 shares its line with the PINNED Hide-queued toggle: the chips
     scroll, the pin never does (viewer-spec draft 6 §1, ruling 19). */
  .bar { display: flex; align-items: flex-end; gap: 8px; }
  .bar .chips { flex: 1 1 auto; min-width: 0; }
  .pin { flex: none; }
  /* One horizontally scrollable row per control group; each control is a
     dimension label ABOVE its chip, scrolling with it (8-15 ruling). Finger
     drag, no scrollbar (a bar spends vertical space — Mike, 2026-08-20). */
  .chips { display: flex; gap: 8px; margin-top: 4px; overflow-x: auto;
           -webkit-overflow-scrolling: touch; align-items: flex-end;
           scrollbar-width: none; padding-bottom: 1px; }
  .chips::-webkit-scrollbar { display: none; }
  .ctl { display: flex; flex-direction: column; flex: none; }
  .ctl label { font-size: 10px; color: var(--faint); margin: 0 0 2px 3px;
               text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .ctl select, .ctl button {
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 16px; padding: 6px 12px; font-size: 14px; max-width: 46vw;
  }
  /* Chip fills (P-015 / handoff-2026-08-10 §3.4): grey = app default,
     mint = user choice (value differs from default), yellow = side-effect
     of another control (decays when the user touches this one), greyed =
     inapplicable. Applies to selects and buttons alike. */
  .ctl .user-set { border-color: var(--mint); color: var(--mint); }
  .ctl .side-effect { border-color: var(--yellow); color: var(--yellow); }
  .ctl .na { opacity: .45; }
  .ctl select:disabled, .ctl button:disabled { opacity: .4; }
  /* The Apply chip: the one load-triggering control (tier 2) — row 3, left
     of Rating, red border, visible only while a load is pending (Mike,
     2026-08-23). */
  .ctl button.apply { border-color: #e0704e; color: #e0704e; font-weight: 600; }
  .ctl button.util { border-radius: 8px; padding: 5px 10px; font-size: 13px; }
  .chips .gap { flex: none; border-left: 1px solid var(--line); height: 26px; margin: 0 2px; }
  #count { font-size: 12px; color: var(--faint); margin-top: 5px; }
  #status { font-size: 12px; margin-top: 4px; display: none; }
  #status.quiet { display: block; color: var(--good); }
  #status.alarm { display: block; color: #e0704e; font-weight: 600; }
  #status .p-blue { color: var(--accent); }  #status .p-green { color: var(--good); }
  #status .p-yellow { color: var(--gold); }  #status .p-red { color: #e0704e; }
  main { padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; max-width: 760px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px;
  }
  .card.hot1 { border-left: 4px solid var(--good); }
  .card.hot2 { border-left: 4px solid var(--gold); }
  .hl { font-weight: 600; cursor: pointer; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--dim); }
  .chip { background: var(--card2); border-radius: 10px; padding: 1px 8px; }
  .chip.exp { background: none; border: 1px dashed var(--faint); color: var(--faint); }
  .score { font-variant-numeric: tabular-nums; }
  .score.a { color: var(--accent); }
  .score.c { color: var(--gold); }
  /* A/V/R list buttons (2026-08-23, replace the single Q badge): A = audio
     (hands-free clips), V = video (watch list, synced to the YouTube
     playlist), R = reading. Tappable in the meta row. .on = the list this
     nugget is on (green fill); .sug = the data-backed suggestion (green
     outline, not selected); .half = header: some of the group. */
  .lb { background: none; border: 1px solid var(--faint); color: var(--faint);
        border-radius: 10px; padding: 0 8px; font-size: 12px; font-weight: 700;
        line-height: 18px; cursor: pointer; margin-left: -2px; }
  .lb.sug { border-color: var(--good); color: var(--good); border-style: dashed; }
  .lb.half { border-color: var(--good); color: var(--good); }
  .lb.on { background: var(--good); border-color: var(--good); color: #08130c; }
  .lists { display: inline-flex; gap: 4px; }
  .lb.kb { border-color: var(--gold); color: var(--gold); margin-left: 2px; }
  .lb.kb.on { background: var(--gold); border-color: var(--gold); color: #1a1300; }
  .card.played { opacity: .55; }
  .card.now { border-color: var(--accent); }
  /* §13 player bar + pane (list modes only) */
  #pbar { display: none; margin-top: 6px; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  #pbar.on { display: flex; }
  #pbar button, #pbar select { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
  #pbar button.primary { background: var(--accent); border-color: var(--accent); color: #08131f; font-weight: 600; }
  #pbar .pnow { flex: 1 1 100%; color: var(--dim); font-size: 12px; }
  #pane { display: none; max-width: 760px; margin: 8px auto 0; padding: 0 10px; }
  #pane.on { display: block; }
  .pbox { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 10px; overflow: hidden; }
  .pbox iframe, .pbox #ytp { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .pbox img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .ptext { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; max-height: 60vh; overflow: auto; white-space: pre-wrap; line-height: 1.55; }
  .ptext .mark { background: rgba(90,168,240,.25); }
  #lock { position: fixed; inset: 0; z-index: 50; background: rgba(8,9,12,.92); display: none; align-items: center; justify-content: center; text-align: center; color: var(--dim); font-size: 14px; padding: 30px; touch-action: none; user-select: none; }
  #lock.on { display: flex; }
  #lock b { color: var(--ink); display: block; font-size: 18px; margin-bottom: 10px; }
  /* Compact score strip: A appeal · C coach · B broccoli · V needs-viz. */
  .scores { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scores .a { color: var(--accent); } .scores .c { color: var(--gold); }
  .scores .b { color: var(--good); } .scores .v { color: var(--dim); }
  .body { display: none; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .card.open .body { display: block; }
  .content { white-space: pre-wrap; }
  .rationale { margin-top: 8px; font-size: 15px; color: var(--gold); }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .watch {
    display: inline-block; background: var(--accent); color: #08131f;
    border-radius: 8px; padding: 8px 14px; text-decoration: none; font-weight: 600; font-size: 14px;
  }
  button.subbtn { border: 0; cursor: pointer; font-family: inherit; }
  button.subbtn:disabled { opacity: 0.6; cursor: default; }
  button.spbtn { padding: 6px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
  button.spbtn:disabled { opacity: 0.6; cursor: default; }
  .stars { display: flex; gap: 2px; }
  .stars button {
    background: none; border: none; font-size: 24px; color: var(--faint);
    padding: 2px 4px; line-height: 1;
  }
  .stars button.lit { color: var(--gold); }
  .chip.res { font-size: 14px; color: var(--gold); }
  .gstars button { font-size: 20px; padding: 2px 3px; }
  .rnote { margin-top: 8px; font-size: 12px; color: var(--faint); }
  .toast { background: var(--card2); border: 1px solid var(--gold); color: var(--gold);
           border-radius: 10px; padding: 6px 10px; font-size: 13px; margin-top: 8px; }
  .ghead {
    background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px;
  }
  .ghead .gtitle { font-weight: 600; cursor: pointer; }
  .ghead .ytitle { margin-top: 2px; font-size: 13px; color: var(--ink); }
  .gmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 5px; font-size: 12px; color: var(--dim); }
  .gwatch { padding: 5px 10px; font-size: 13px; }
  .gcards {
    display: flex; flex-direction: column; gap: 6px;
    margin-left: 10px; border-left: 2px solid var(--line); padding-left: 8px;
  }
  .empty { color: var(--faint); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <div class="chips" id="row1"></div>
  <div class="chips" id="row2"></div>
  <!-- Apply is PINNED at row 3's left when a load is pending (Mike,
       2026-08-23): the rest of the row scrolls UNDER it. -->
  <div class="bar"><span id="applySlot" style="flex:none"></span><div class="chips" id="row3"></div></div>
  <!-- Tier-2 playlist builder (spec §9d): commit top-N of the current view. -->
  <div class="chips" id="rowBuilder"></div>
  <div id="count"></div>
  <div id="status"></div>
  <div id="pbar"></div>
</header>
<div id="pane"></div>
<main id="list"><div class="empty">Loading…</div></main>
<div id="lock"><div><b>locked</b>playback continues — press and hold 1.5 s to unlock</div></div>
<script>
// Static shell (GitHub Pages). All data comes from the key-gated Supabase
// function below; the key lives in the bookmark's ?key= parameter and, once
// seen, in this device's localStorage (cr_review_key — shared with the
// capture surfaces) so an installed app (N-view, RV-031) opens without a
// key in its start_url.
const BASE = "https://zowilxlpldqxtotrvekd.supabase.co/functions/v1/yt-review";
const urlKey = new URLSearchParams(location.search).get("key");
if (urlKey) localStorage.setItem("cr_review_key", urlKey);
const KEY = urlKey || localStorage.getItem("cr_review_key");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});

// Controls per viewer-spec draft 6 (working_docs projects/nugget-review/
// viewer-spec.md): every mutually exclusive set is ONE dropdown with its
// dimension label above; every filter list carries All, first, as default;
// "Any" is retired. Row order follows the layered rule (§1): cause left of
// effect, meaning-changers in the no-scroll zone, frequency, utilities last.
// "YT-subscrip" not "Subs" (Mike, 2026-08-23): "Subs" read as ambiguous next
// to Substack — both are subscriptions in the ordinary sense.
// Key "yt_subscribed" (was "subs" — it misled in code as it did on screen).
const SCOPES = [["","All"],["yt_subscribed","YT-subscrip"],["substack","Substack"],["substack_paid","Substack-paid"],["manual","My adds"],["campaign","Campaign"]];
const AGES   = [["","All"],["2","≤ 2 days"],["10","≤ 10 days"],["60","≤ 2 months"],["180","≤ 6 months"],["365","≤ 1 year"]];
const GROUPS = [["","None"],["video","Video"]];
// Sort keys (8-10 §3.1 names; Coach/Broccoli renamed 2026-08-22). Each is
// [key, label, value-of-nugget, null-allowed]. Nulls sort LAST in both
// directions; ties break on Appeal desc then id — a total, stable order.
const SORTS = [
  ["appeal",     "Appeal",     n => n.personal_score],
  ["coach",      "Coach",      n => n.expert_score],
  ["broccoli",   "Broccoli",   n => residual(n)],
  ["needs_viz",  "Needs-viz",  n => n.needsViz],
  ["my_rating",  "My_rating",  n => n.rating],
  ["yt_views",   "YT_views",   n => n.viewCount],
  ["duration",   "Duration",   n => n.durationSeconds],
  ["date_pub",   "Date-pub",   n => ts(n.publishedAt || n.created_at)],
  ["date_add",   "Date-add",   n => ts(n.manualAddedAt || n.discoveredAt || n.created_at)],
  ["date_dug",   "Date-dug",   n => ts(n.created_at)],
  ["date_q",     "Date-Q",     n => ts(n.queuedAt)],
  ["date_rev",   "Date-rev",   n => ts(n.reviewedAt)],
];
const RATEFS = [["","All"],["unrated","Unrated"],["5","5 ★"],["4","≥ 4 ★"],["3","3 ★"],["pickled","Pickled (1–2 ★)"],["keepers","Keepers"]];
// yt_nuggets.rating column comment is the source of truth for this scale.
// One column, the abstract's rating (Mike, 2026-08-22); 1-2 = pickled.
const SCALE = { 1: "never gonna look (pickled)", 2: "unlikely to use (pickled)",
  3: "neutral / did not regret", 4: "good", 5: "outstanding" };
const END_MARGIN = 30; // display clamp: a link never lands past duration − 30 s (spec §7.2)
// Destination lists (2026-08-23): exactly one per nugget; the suggestion
// (dashed outline) follows the data — posts -> R; needs_viz >= viz_hi -> V;
// <= viz_lo -> A; between or unscored -> A and V.
const LISTS = [["audio", "A", "audio — hands-free clips page"], ["video", "V", "video — watch list (synced to the YouTube playlist)"], ["read", "R", "reading list"]];
let vizHi = 70, vizLo = 30;
// listed (viewer-spec §13): all | hidden | audio | video | read — a list value
// switches the viewer into that DELIVERY MODE (player bar shown). played:
// hide items a renderer already finished (default) or show them dimmed.
// ytRoute: how video items play on the Audio list — in-page clip (screen
// on) or the YouTube app (Premium; locked screen; whole-video fallback).
const DEFAULTS = { scope: "", src: "", cat: "", domain: "", age: "", ratef: "",
  expired: false, listed: "all", played: false, ytRoute: "page", sort: "appeal", dir: "desc", sortOrigin: "user",
  group: "", zoom: 1 };
const LISTED = [["all", "All"], ["hidden", "Hide-Qd"], ["audio", "Audio only"], ["video", "Video only"], ["read", "Read only"]]; // "Hide-Qd" = hide items already on any list (Mike's label, 2026-08-23)
let all = [], slope = 0, intercept = 0;
let byId = new Map(); // id -> nugget (bodies arrive by id)
// Tiered load (Mike, 2026-08-23): facets first (tier 1), the chosen
// Scope+Source subset on Apply (tier 2), everything else client-side.
let facets = null;      // /facets payload
let loadedSel = null;   // {scope, src} of the subset currently in `all`
let loading = false;
let catTtls = {}, defaultTtl = 180, catList = [];
let manualEmpty = [];
let phraseStatus = {};  // "<campaignId>|<phrase>" -> {active, stopped_at}
let channelHype = new Map();
// Storage key bumped ytr2 -> ytr3 (2026-08-22): state shape changed again
// (state chips/watched gone; dir, hideQ, sortOrigin, group-as-value added).
let state = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("ytr3") || "{}"));
// Saved-state migrations (2026-08-23): scope key "subs" → "yt_subscribed";
// the hideQ toggle → listed:"hidden"; ?listed= in the URL presets the mode
// (clips.html redirects here with it).
if (state.scope === "subs") state.scope = "yt_subscribed";
if (state.hideQ === true && !state.listed) state.listed = "hidden";
delete state.hideQ;
if (!LISTED.some(l => l[0] === state.listed)) state.listed = "all";
{ const pl = new URLSearchParams(location.search).get("listed"); if (pl && LISTED.some(l => l[0] === pl)) state.listed = pl; }
let openId = null;
// Group-header fold state (Mike, 2026-08-26): a MODE plus per-header
// exceptions. collapseMode false = headers open by default (gToggled holds
// the ones the user closed); true = headers closed by default (gToggled
// holds the ones the user opened). The row-2 "Headers" chip flips the mode
// and CLEARS the exceptions — a global click overrides individual state.
let collapseMode = false;
let gToggled = new Set();
function isGroupCollapsed(vid) { return collapseMode ? !gToggled.has(vid) : gToggled.has(vid); }
// Cards mutated while on screen keep their spot even once they stop passing
// the filters (a 1-2 star tap shows its pickled acknowledgment instead of
// vanishing mid-tap). Cleared on any filter/sort/group change.
let pinned = new Set();
let toasts = new Map(); // nugget id -> acknowledgment text, cleared with pinned
// Windowed paint (2026-08-23): the list is filtered and sorted in FULL (the
// counts are exact) but only the first WINDOW cards are built into the DOM;
// the next WINDOW append as the sentinel scrolls near (painting ~19k cards
// at once was a multi-second cost on the phone; a session reads <40).
const WINDOW = 60;
let paintLimit = WINDOW;
const io = ("IntersectionObserver" in window)
  ? new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { paintLimit += WINDOW; render(); } },
      { rootMargin: "800px" })
  : null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function save() { localStorage.setItem("ytr3", JSON.stringify(state)); }
function ts(iso) { return iso ? new Date(iso).getTime() : null; }
function fmtT(s) { return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function fmtD(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function fmtDur(s) {
  const m = Math.round(s / 60);
  return m >= 60 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : m + " min";
}
// Broccoli = the regression residual (coach score above what the appeal
// prediction explains), NOT a raw subtraction — a label promising
// subtraction would lie (8-10 §3.1).
function residual(n) { return n.expert_score - (intercept + slope * n.personal_score); }

function regress() {
  const pts = all.filter(n => n.personal_score != null && n.expert_score != null);
  const N = pts.length;
  if (N < 3) { slope = 0; intercept = 0; return; }
  let sx=0, sy=0, sxx=0, sxy=0;
  for (const n of pts) { sx+=n.personal_score; sy+=n.expert_score;
    sxx+=n.personal_score*n.personal_score; sxy+=n.personal_score*n.expert_score; }
  const denom = N*sxx - sx*sx;
  slope = denom ? (N*sxy - sx*sy) / denom : 0;
  intercept = (sy - slope*sx) / N;
}

function categoriesOf(n) {
  return (n.categories && n.categories.length) ? n.categories
    : (n.nugget_type ? [n.nugget_type] : []);
}

// ---- derived predicates (spec §2) ----------------------------------------
function pickled(n) { return n.rating != null && n.rating <= 2; }
function queued(n) { return !!(n.queueList || n.queuedAt); } // on any list
// Post-shaped content: any non-YouTube source (posts carry bodies, YouTube
// carries transcripts). A shape test, not a source list — every source gets
// the same treatment (Mike, 2026-08-24).
function isPostSource(n) { return n.source !== "youtube"; }
function suggestedLists(n) {
  if (isPostSource(n)) return ["read"];
  const v = n.needsViz;
  if (v == null) return ["audio", "video"];
  if (v >= vizHi) return ["video"];
  if (v <= vizLo) return ["audio"];
  return ["audio", "video"];
}
// Every item offers all three lists (Mike, 2026-08-23: the matrix has no
// dead cells — a post can be voiced on Audio, a video read as transcript).
function listsFor() { return ["audio", "video", "read"]; }
// Soft expiry: UNRATED and older (by created_at) than the max TTL over its
// tags. Returns the trigger {tag, days} so the badge can name WHICH tag's
// TTL fired (Automatic behavior shows its trigger), or null.
function expiry(n) {
  if (n.rating != null) return null;
  const cats = categoriesOf(n);
  if (!cats.length) return null;
  let tag = null, ttl = -1;
  for (const c of cats) { const t = catTtls[c] ?? defaultTtl; if (t > ttl) { ttl = t; tag = c; } }
  return Date.now() - new Date(n.created_at) > ttl * 86400000 ? { tag, days: ttl } : null;
}
function isExpired(n) { return expiry(n) != null; }
// Display clamp (spec §7.2): the link never lands past duration − 30 s.
function displayStart(n) {
  if (n.start_seconds == null) return null;
  if (!n.durationSeconds) return n.start_seconds;
  return Math.max(0, Math.min(n.start_seconds, n.durationSeconds - END_MARGIN));
}

// Scope = provenance only, no quality judgment anywhere.
function scopePass(n) {
  const manual = !!(n.sourceKey && n.sourceKey.endsWith("_manual"));
  switch (state.scope) {
    case "yt_subscribed": return n.source === "youtube" && n.campaignId == null && !manual;
    case "substack": return n.source === "substack";
    case "substack_paid": return n.source === "substack_paid";
    case "manual":   return manual;
    case "campaign": return n.campaignId != null;
    default:         return true;
  }
}

// Judgment filters (Rating dropdown + Expired toggle + Hide-queued). These
// alone define "available" in the header; content filters are ignored there.
// Default view: NOT pickled AND NOT expired; pickled is reachable ONLY via
// Rating -> Pickled (ruling 1a); Expired=shown re-admits expired only.
function listMode() { return ["audio", "video", "read"].includes(state.listed) ? state.listed : null; }
function ratingFilterPass(n) {
  const r = state.ratef;
  if (r === "pickled") return pickled(n);
  if (r === "keepers" && !n.keeperAt) return false;
  if (r === "unrated" && n.rating != null) return false;
  if (r === "5" && n.rating !== 5) return false;
  if (r === "4" && !(n.rating >= 4)) return false;
  if (r === "3" && n.rating !== 3) return false;
  return true;
}
function judgmentPass(n) {
  const lm = listMode();
  if (lm) {
    // Option b (Mike "go b", 2026-08-23; principle prn_fd31f79e-0a17-40bc-
    // b7d7-1dc1b029277e): in a list MODE the list wins visibility — a
    // listed item shows even if pickled or expired (you listed it
    // deliberately; the card still wears its ★1/★2). Played and an explicit
    // Rating filter still apply.
    if (n.queueList !== lm) return false;
    if (!state.played && n.playedAt) return false;
    return ratingFilterPass(n);
  }
  if (state.ratef === "pickled") return pickled(n);
  if (pickled(n)) return false;
  if (!ratingFilterPass(n)) return false;
  if (!state.expired && isExpired(n)) return false;
  if (!state.played && n.playedAt) return false;
  // Listed (§13.2): hidden drops listed items; extras (ride-along rows
  // outside the loaded scope) appear only in list modes.
  if (state.listed === "hidden" && queued(n)) return false;
  if (n.extra) return false;
  return true;
}

function catPass(n) { return !state.cat || categoriesOf(n).includes(state.cat); }
function domPass(n) { return !state.domain || n.domain === state.domain; }

function agePass(n) { return !state.age || ageDays(n) <= Number(state.age); }

}
// Scope match for one value (mirror of scopePass's switch, for counting).
function scopeMatch(n, val) {
  const manual = !!(n.sourceKey && n.sourceKey.endsWith("_manual"));
  switch (val) {
    case "yt_subscribed": return n.source === "youtube" && n.campaignId == null && !manual;
    case "substack": return n.source === "substack";
    case "substack_paid": return n.source === "substack_paid";
    case "manual":   return manual;
    case "campaign": return n.campaignId != null;
    default:         return true;
  }
}

// Per-option counts ("facets", Mike 2026-08-23): each option shows how many
// rows you would get by choosing it, given every OTHER current filter. One
// pass over the index per render; the full metadata index is local, so no
// server call. Source ignores the scope filter's downstream (it is rebuilt
// from scope anyway); Scope ignores Source (Source depends on Scope).
function facetCounts() {
  // Scope and Source counts are tier-1 (server facets); these are the
  // within-subset counts for the client-side filters.
  const F = { cat: new Map(), domain: new Map(), age: new Map(), rating: new Map() };
  const bump = (m, k) => m.set(k, (m.get(k) || 0) + 1);
  for (const n of all) {
    const j = judgmentPass(n);
    const lm = listMode();
    const jx = (state.played || !n.playedAt) && (lm
      ? n.queueList === lm // option b: the list wins visibility in a mode
      : (state.expired || !isExpired(n)) && !(state.listed === "hidden" && queued(n)) && !n.extra); // judgment minus the rating dropdown
    const sc = scopePass(n), sr = sourcePass(n), ca = catPass(n), dm = domPass(n), ag = agePass(n);
    if (j && sc && sr && dm && ag) { bump(F.cat, ""); for (const c of categoriesOf(n)) bump(F.cat, c); }
    if (j && sc && sr && ca && ag) { bump(F.domain, ""); if (n.domain) bump(F.domain, n.domain); }
    if (j && sc && sr && ca && dm) { bump(F.age, ""); const d = ageDays(n); for (const [val] of AGES) if (val && d <= Number(val)) bump(F.age, val); }
    if (jx && sc && sr && ca && dm && ag) {
      const r = n.rating;
      if (pickled(n)) bump(F.rating, "pickled");
      else {
        bump(F.rating, "");
        if (r == null) bump(F.rating, "unrated");
        if (r === 5) bump(F.rating, "5");
        if (r >= 4) bump(F.rating, "4");
        if (r === 3) bump(F.rating, "3");
        if (n.keeperAt) bump(F.rating, "keepers");
      }
    }
  }

}
function withCount(defs, counts) {
  const fmt = (k) => " (" + (counts.get(k) || 0).toLocaleString() + ")";
  return defs.map(d => d.group != null
    ? { group: d.group, items: d.items.map(([v, l]) => [v, l + fmt(v)]) }
    : [d[0], d[1] + fmt(d[0])]);
}

// THE declared sort (P-002): one key, one direction, nulls last both ways,
// total tie-break — every rendered sibling list is fully ordered by it.
function sortDef() { return SORTS.find(s => s[0] === state.sort) || SORTS[0]; }

  const get = sortDef()[2];

  return (a, b) => {
    const va = get(a), vb = get(b);
    const na = va == null || Number.isNaN(va), nb = vb == null || Number.isNaN(vb);
    if (na && nb) return tieBreak(a, b);
    if (na) return 1;
    if (nb) return -1;
    if (va !== vb) return (va < vb ? -1 : 1) * sign;
    return tieBreak(a, b);

}
function tieBreak(a, b) {
  return (b.personal_score - a.personal_score) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
}

function visible() {
  const v = all.filter(n => (contentPass(n) && judgmentPass(n)) || pinned.has(n.id));
  v.sort(comparator());
  return v;
}

    return (facets.campaigns || []).map(c => ({

// ---- Read renderer: text pane ---------------------------------------------
async function renderRead(n, pane) {
  pane.innerHTML = '<div class="ptext" style="color:var(--faint)">loading text…</div>';

    if (isPostSource(n)) {
      const p = await (await fetch(BASE + "/post?key=" + encodeURIComponent(KEY) + "&id=" + encodeURIComponent(n.video_id))).json();
      pane.innerHTML = '<div class="ptext"><b>' + esc(p.title || n.videoTitle) + "</b>\n\n" + esc(p.text || "(no stored text — teaser-only post)") + "</div>";
    } else {
      const t = await (await fetch(BASE + "/transcript?key=" + encodeURIComponent(KEY) + "&id=" + encodeURIComponent(n.video_id))).json();
      const timed = t.timed || "";
      // Open at the nugget's time: mark the first [m:ss] line at/after start.
      const start = displayStart(n) ?? 0;
      let html = "", marked = false;
      for (const line of (timed || t.text || "").split("\n")) {

    const textWords = String(p?.text || "").trim().split(/\s+/).filter(Boolean).length;
    const durS = await probeAudioDuration(m.audio_url, 4000);
    if (!PL.active || PL.items[PL.idx] !== n) return;
    const estWords = durS ? Math.round(durS / 60 * speechWpm) : null;
    const mediaWins = estWords != null && estWords >= 1.2 * textWords;
    const mins = durS ? Math.round(durS / 60) : null;

      '<div class="bar" style="margin-bottom:6px">' +
      '<button id="ovMedia"' + (mediaWins ? ' class="primary"' : "") + '>&#9654; attached audio' + (mins != null ? " (~" + mins + " min)" : " (length unknown)") + "</button>" +
      '<button id="ovText"' + (!mediaWins ? ' class="primary"' : "") + '>&#9654; voice article (' + textWords.toLocaleString() + " words)</button></div>";
    const playMedia = () => {
      pane.innerHTML = overrideBar; bindOverrides(n, pane, done, p);
      const a = audioEl(); pane.appendChild(a);

      a.onerror = () => { pane.insertAdjacentHTML("beforeend", '<div class="empty">audio failed to load — skipping</div>'); setTimeout(() => PL.active && done(), 1200); };

// ---- Video renderer: player + screen ---------------------------------------

// ---- YouTube clip (in-page) ------------------------------------------------

// Play a unit's rendered chunk files through our own <audio>: gapless-ish via

// then falls back to the tier-1 paths (Web Speech / enclosure / YouTube).
async function playRenderedUnit(n, unit, pane, done, attempt) {
  pane.innerHTML = '<div class="ptext" id="ttsPane" style="color:var(--dim)">fetching rendered audio…</div>';
  let res = null;
  try {
    res = await (await fetch(BASE + "/tts-urls?key=" + encodeURIComponent(KEY), {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ units: [unit] }),
    })).json();
  } catch (e) {}
  if (!PL.active || PL.items[PL.idx] !== n) return;
  const u = res && res.units && res.units[0];
  const chunks = (u && u.chunks) || [];

    if (u && u.pending > 0 && (attempt || 0) < 24) { // ~2 min of 5 s polls

      if (el) el.textContent = "rendering audio… (" + u.pending + " chunk" + (u.pending > 1 ? "s" : "") + " in flight)";

function expandPlaylist(id) {

  for (const it of pl.items || []) {
    const n = byId.get(it.nugget_id);

    const fullUnit = { unit_type: isPostSource(n) ? "post" : "transcript", unit_id: n.video_id };
    if (it.mode === "card") out.push({ ...n, _ttsUnit: { unit_type: "card", unit_id: n.id } });

    else {

  else {
    const d = new Date();
    body.name = (d.getMonth() + 1) + "-" + d.getDate() + " " + (loadedSel.scope || "all") + " " + state.sort + " top" + items.length + " " + mode;
    if (voice && voice !== ttsInfo.voice) body.voice = { vendor: ttsInfo.vendor, model: ttsInfo.model, voice };
  }
  try {
    const res = await fetch(BASE + "/builder-commit?key=" + encodeURIComponent(KEY), {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
    });
    const j = await res.json();
    if (!res.ok) { msg.textContent = "error: " + (j.error || res.status); return; }
    const newItems = (start) => items.map((it, k) => ({ playlist_id: j.playlist_id, position: start + k, nugget_id: it.nugget_id, mode: it.mode, played_at: null }));
    if (pl) pl.items = (pl.items || []).concat(newItems(pl.items ? pl.items.length : 0));
    else playlists.push({
      id: j.playlist_id, kind: "built", name: body.name,
      voice_vendor: body.voice ? body.voice.vendor : null,
      voice_model: body.voice ? body.voice.model : null,
      voice_voice: body.voice ? body.voice.voice : null,
      items: newItems(0),
    });
    msg.textContent = "committed " + j.items + " item(s), " + j.jobs + " render job(s) — first audio in ~15-20 s";
    render();
  } catch (e) { msg.textContent = "network error"; }
}
function setMediaSession(n) {
  if (!("mediaSession" in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: n.headline || "", artist: n.channelLabel || "", album: n.plainTitle || n.videoTitle || "" });
    navigator.mediaSession.setActionHandler("nexttrack", () => playerGo(PL.idx + 1));
    navigator.mediaSession.setActionHandler("previoustrack", () => playerGo(PL.idx - 1));
    navigator.mediaSession.setActionHandler("pause", () => playerPause());
    navigator.mediaSession.setActionHandler("play", () => playerPause());
  } catch (e) {}
}
// Pocket guard: long-press 1.5 s to unlock.
{ const lock = document.getElementById("lock"); let t = null;
  const arm = () => { t = setTimeout(() => { lock.className = ""; }, 1500); };
  const disarm = () => clearTimeout(t);
  lock.addEventListener("touchstart", arm, { passive: true }); lock.addEventListener("touchend", disarm); lock.addEventListener("touchcancel", disarm);
  lock.addEventListener("mousedown", arm); lock.addEventListener("mouseup", disarm); }

// ---- bodies (content + rationale) arrive per window, not with the index --
const bodiesInFlight = new Set();
async function ensureBodies(ids, force) {
  const want = [...new Set(ids)].filter(id => {
    const n = byId.get(id);
    return n && (force || (n.content == null && !bodiesInFlight.has(id)));
  });
  if (!want.length) return;
  for (const id of want) bodiesInFlight.add(id);
  for (let k = 0; k < want.length; k += 100) {
    const chunk = want.slice(k, k + 100);
    try {
      const res = await fetch(BASE + "/bodies?key=" + encodeURIComponent(KEY), {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ ids: chunk }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      let openArrived = false;
      for (const [id, b] of Object.entries(data.bodies || {})) {
        const n = byId.get(id);
        if (!n) continue;
        n.content = b.content ?? ""; n.rationale = b.rationale ?? null;
        if (id === openId) openArrived = true;
      }
      if (openArrived) render();
    } catch (e) {
      // Leave them unloaded: the expanded card shows "tap to retry".
    } finally {
      for (const id of chunk) bodiesInFlight.delete(id);
    }
  }
}
function retryBody(id) { ensureBodies([id], true).then(() => render()); }

// Manual adds analyzed with ZERO nuggets — shown because you asked (the
// only honest feedback signal on the extractor). Manual sources only.
function manualEmptyHtml() {
  if (!manualEmpty.length || state.scope === "campaign") return "";
  const rows = manualEmpty.map(v => {
    const label = v.yt_channels?.label || "?";
    const link = v.url || "https://www.youtube.com/watch?v=" + v.video_id;
    const verdict = v.status === "processed" ? "analyzed — no nuggets found"
      : v.status === "no_transcript" ? "no transcript available"
      : "failed: " + esc((v.error_detail || v.status).slice(0, 80));
    return '<div style="margin-top:4px">' +
      '<a href="' + esc(link) + '" target="_blank" rel="noopener" style="color:var(--ink)">' +
      esc(v.plain_title || v.title || v.video_id) + "</a>" +
      ' <span style="color:var(--faint)">· ' + esc(label) + " · " + verdict + "</span></div>";
  });
  return '<div class="card" style="border-left:4px solid var(--faint)">' +
    '<div style="font-size:12.5px;color:var(--dim)"><b>Your manual adds — ' +
    manualEmpty.length + " with nothing to show</b> (you asked, so here's the answer)</div>" +
    rows.join("") + "</div>";
}

// Group=Video: multi-nugget videos under a header; singletons stay plain
// cards. Groups order by first appearance in the sorted list (= the group's
// best value under the declared key); items within a group stay in the
// declared order too (spec §3.7 post) — the storyline order went with the
// watched controls.
function grouped(v) {
  const byVid = new Map();
  for (const n of v) {
    if (!byVid.has(n.video_id)) byVid.set(n.video_id, []);
    byVid.get(n.video_id).push(n);
  }
  const out = [], done = new Set();
  for (const n of v) {
    if (done.has(n.video_id)) continue;
    done.add(n.video_id);
    const g = byVid.get(n.video_id);
    if (g.length === 1) { out.push({ html: card(n), n: 1, ids: [n.id] }); continue; }
    out.push({
      html: ghead(n, g) + (isGroupCollapsed(n.video_id) ? "" : '<div class="gcards">' + g.map(card).join("") + "</div>"),
      n: g.length,
      ids: g.map(x => x.id),
    });
  }
  return out;
}

// Campaign provenance chips (Mike, 2026-08-23): the campaign and the search
// phrase that found the video, beside the other provenance chips.
function campaignChips(n) {
  if (n.campaignId == null) return "";
  const q = n.campaignQuery || "";
  const short = q.length > 40 ? q.slice(0, 38) + "…" : q;
  return '<span class="chip" title="campaign">campaign: ' + esc(n.campaignName || n.campaignId) + "</span>" +
    (q ? '<span class="chip" title="search phrase that found this video: ' + esc(q) + '">q: “' + esc(short) + "”</span>" : "");
}

// Per-nugget A/V(/R) buttons: filled = on that list; dashed = suggested.
function listButtons(n) {
  const sug = suggestedLists(n);
  return '<span class="lists">' + listsFor(n).map(key => {
    const [, letter, title] = LISTS.find(l => l[0] === key);
    const on = n.queueList === key;
    return '<button class="lb' + (on ? " on" : sug.includes(key) ? " sug" : "") + '" title="' + title +
      (on ? " — tap to remove" : " — tap to add") + '" onclick="setList(\'' + n.id + "','" + key + "')\">" + letter + "</button>";
  }).join("") + "</span>";
}
// Header A/V buttons (bulk): filled = every nugget on it; half = some;
// tap = put every unlisted nugget on it, or clear all if all are on it.
function groupListButtons(vid, g) {
  const keys = listsFor();
  return '<span class="lists">' + keys.map(key => {
    const [, letter, title] = LISTS.find(l => l[0] === key);
    const all = g.every(x => x.queueList === key), some = g.some(x => x.queueList === key);
    return '<button class="lb' + (all ? " on" : some ? " half" : "") + '" title="' + title +
      (all ? " — tap to clear the whole video" : " — tap to list every unlisted nugget") + '" onclick="setListAll(\'' + vid + "','" + key + "')\">" + letter + "</button>";
  }).join("") + "</span>";
}
// Compact score strip: A appeal · C coach · B broccoli (residual) · V needs-viz.
function scoreStrip(n) {
  const b = residual(n);
  return '<span class="scores" title="A appeal · C coach · B broccoli (coach above what appeal predicts) · V needs-viz">' +
    '<span class="a">A' + Math.round(n.personal_score) + "</span> " +
    '<span class="c">C' + Math.round(n.expert_score) + "</span> " +
    '<span class="b">B' + (b >= 0 ? "+" : "") + b.toFixed(0) + "</span> " +
    '<span class="v">V' + (n.needsViz == null ? "–" : n.needsViz) + "</span></span>";
}

function ghead(n, g) {
  const isC = isGroupCollapsed(n.video_id);
  const dur = n.durationSeconds ? " in " + fmtDur(n.durationSeconds) : "";
  // Header stars light to the group's lowest rating (unrated = 0): a fully
  // rated group reads at a glance, a mixed one stays dark. They are a BULK
  // control over the group's abstracts — there is no video rating.
  const gmin = Math.min(...g.map(x => x.rating || 0));
  const humble = n.plainTitle || n.headline || n.videoTitle || n.channelLabel;
  const hype = n.hypeLevel != null
    ? '<span class="chip">hype ' + (n.hypeLevel > 0 ? "+" : "") + n.hypeLevel + "</span>" : "";
  const gen = n.generation > 1 ? '<span class="chip" title="reprocessed generation">(' + n.generation + ")</span>" : "";
  return '<div class="ghead">' +
    '<div class="gtitle" onclick="toggleGroup(\'' + n.video_id + '\')">' +
      (isC ? "&#9656; " : "&#9662; ") + esc(humble) + "</div>" +
    (n.videoTitle && n.videoTitle !== humble
      ? '<div class="ytitle">' + esc(n.videoTitle) + "</div>" : "") +
    '<div class="gmeta">' +
      "<b>" + esc(n.channelLabel) + "</b>" +
      "<span>" + fmtD(n.publishedAt || n.created_at) + "</span>" +
      '<span class="chip">' + g.length + " nuggets" + dur + "</span>" + hype + gen + campaignChips(n) +
      '<div class="stars gstars">' + [1,2,3,4,5].map(k =>
        '<button title="' + k + ' — ' + SCALE[k] + ' (rates every unrated nugget; re-tap corrects a uniformly rated group)" class="' +
          (gmin >= k ? "lit" : "") + '" onclick="rateAll(\'' + n.video_id + '\',' + k + ')">&#9733;</button>'
      ).join("") + "</div>" +
      groupListButtons(n.video_id, g) +
      '<a class="watch gwatch" target="_blank" rel="noopener" href="' +
        (isPostSource(n) ? esc(n.contentUrl || "#") : "https://www.youtube.com/watch?v=" + n.video_id) + '">' +
        (isPostSource(n) ? "&#128214; Open" : "&#9654; Watch") + "</a>" +
      (!isPostSource(n) && n.campaignId != null && n.channelId
        ? '<button class="watch subbtn" id="sub-' + esc(n.video_id) +
          '" title="subscribe to this channel in YouTube AND adopt it into the pipeline&#39;s subscribed stream (future uploads polled hourly)"' +
          ' onclick="subscribeCh(\'' + esc(n.channelId) + "','" + esc(n.video_id) + '\')">+ Subscribe</button>' : "") +
      phraseControl(n) + unsubControls(n) +
    "</div></div>";
}

function toggleGroup(vid) {
  gToggled.has(vid) ? gToggled.delete(vid) : gToggled.add(vid);
  render();
}

// Header stars rate every *unrated* nugget in the group; mixed individual
// ratings are never overwritten; a uniformly rated group stays correctable
// from the header (different star re-rates, same star clears).
async function rateAll(vid, k) {
  const g = all.filter(x => x.video_id === vid);
  let targets = g.filter(x => x.rating == null);
  let next = k;
  if (!targets.length) {
    const first = g[0] && g[0].rating;
    if (!g.every(x => x.rating === first)) return; // mixed: hands off
    targets = g;
    next = first === k ? null : k;
  }
  for (const n of targets) { n.rating = next; pinned.add(n.id); if (next != null && next <= 2) toasts.set(n.id, PICKLE_ACK); }
  render();
  for (const n of targets) await post("/rate", { id: n.id, rating: next });
}

// Header A/V (bulk): every nugget already on that list -> clear all;
// otherwise put every UNLISTED nugget on it (mirror of the rateAll asymmetry;
// nuggets already on another list are left alone).
async function setListAll(vid, key) {
  const g = all.filter(x => x.video_id === vid);
  const allOn = g.every(x => x.queueList === key);
  const targets = allOn ? g : g.filter(x => !x.queueList);
  const ts = new Date().toISOString();
  for (const n of targets) { n.queueList = allOn ? null : key; n.queuedAt = allOn ? null : ts; pinned.add(n.id); }
  render();
  for (const n of targets) await post("/queued", { id: n.id, list: allOn ? null : key });
}

// Subscribe (campaign headers), both sides since 2026-08-26: joins the
// channel in YouTube via yt-review's OAuth AND flips yt_channels.enabled so
// the poller adopts it (future uploads flow as subscription nuggets; the
// existing campaign nuggets keep their campaign provenance). Needs its own
// fetch: post() discards the response body, and "already subscribed" must
// read back as success.
async function subscribeCh(chId, vid) {
  const b = document.getElementById("sub-" + vid);
  if (b) { b.disabled = true; b.textContent = "…"; }
  try {
    const res = await fetch(BASE + "/subscribe?key=" + encodeURIComponent(KEY), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ channel_id: chId }),
    });
    const out = await res.json().catch(() => null);
    if (!res.ok || !out || !out.ok) throw new Error((out && out.error) || "HTTP " + res.status);
    if (b) b.textContent = out.already ? "✓ already subscribed" : "✓ subscribed";
  } catch (e) {
    if (b) { b.disabled = false; b.textContent = "+ Subscribe"; }
    alert("Subscribe failed: " + e.message);
  }
}

// Stop/restart phrase (campaign headers, Mike 2026-08-27): the header shows
// "✗ stop phrase" while the finding query is active, or "Stopped <date> ·
// restart?" once stopped (yt_campaign_queries.active + stopped_at, shipped
// as data.phrase_status). The prospector skips inactive phrases from the
// next sweep; existing videos and nuggets are untouched either way. Looks
// the nugget up by video_id to avoid quoting the phrase into the onclick.
// A pre-2026-08-27 deactivation has no stamp — shows "Stopped" dateless.
function phraseControl(n) {
  if (n.campaignId == null || !n.campaignQuery) return "";
  const st = phraseStatus[n.campaignId + "|" + n.campaignQuery];
  if (st && st.active === false) {
    return '<span class="chip">Stopped' + (st.stopped_at ? " " + fmtD(st.stopped_at) : "") + "</span>" +
      '<button class="lb spbtn" id="sp-' + esc(n.video_id) +
      '" title="restart &#8220;' + esc(n.campaignQuery) + '&#8221; — the prospector searches it again from the next sweep"' +
      ' onclick="setPhrase(\'' + esc(n.video_id) + '\', true)">restart?</button>';
  }
  return '<button class="lb spbtn" id="sp-' + esc(n.video_id) +
    '" title="stop the phrase that found this video — &#8220;' + esc(n.campaignQuery) +
    '&#8221; is skipped from the next prospector sweep (restartable; existing videos and nuggets untouched)"' +
    ' onclick="setPhrase(\'' + esc(n.video_id) + '\', false)">&#10007; stop phrase</button>';
}
// Unsubscribe pair (Mike, 2026-08-27): WEEDING VIEW only — any score sort,
// ascending. "unsub nuggets" stops the pipeline polling the channel
// (enabled = false; rows and nuggets kept) — applies to YouTube
// subscriptions AND free substack (the poller pulls only enabled channels,
// both feed kinds); substack_paid is excluded because mail ingest ignores
// enabled and the button would claim a stop it cannot deliver. "unsub
// YouTube" removes the account subscription (OAuth delete). Both are
// two-tap: first tap arms ("sure?", 5 s), second tap fires.
const SCORE_SORTS = ["appeal", "coach", "broccoli", "needs_viz", "my_rating"];
const armedUnsub = new Set();
const doneUnsub = new Map();  // "<vid>|<side>" -> result text, survives re-renders
function unsubControls(n) {
  if (!(state.dir === "asc" && SCORE_SORTS.includes(state.sort))) return "";
  const manual = !!(n.sourceKey && n.sourceKey.endsWith("_manual"));
  const subYt = n.source === "youtube" && n.campaignId == null && !manual;
  const subStack = n.source === "substack";
  if (!subYt && !subStack) return "";
  const btn = (side, label) => {
    const k = n.channelId + "|" + side;  // per CHANNEL: every header of the channel shows one state
    if (doneUnsub.has(k)) return '<button class="lb spbtn" disabled>' + doneUnsub.get(k) + "</button>";
    return '<button class="lb spbtn" id="un-' + side + "-" + esc(n.video_id) +
      '" title="' + (side === "pipeline"
        ? "stop the pipeline polling this channel — enabled = false; existing nuggets kept"
        : "remove this channel from the YouTube account&#39;s subscriptions") +
      ' — first tap arms, second tap fires"' +
      ' onclick="unsub(\'' + esc(n.video_id) + "','" + side + '\')">' +
      (armedUnsub.has(k) ? "sure?" : label) + "</button>";
  };
  return btn("pipeline", "&#10005; unsub nuggets") +
    (subYt ? btn("youtube", "&#10005; unsub YouTube") : "");
}
async function unsub(vid, side) {
  const n0 = all.find(x => x.video_id === vid);
  if (!n0 || !n0.channelId) return;
  const k = n0.channelId + "|" + side;
  if (!armedUnsub.has(k)) {
    armedUnsub.add(k);
    setTimeout(() => { if (armedUnsub.delete(k)) render(); }, 5000);
    render();
    return;
  }
  armedUnsub.delete(k);
  const n = n0;
  const b = document.getElementById("un-" + side + "-" + vid);
  if (b) { b.disabled = true; b.textContent = "…"; }
  try {
    const res = await fetch(BASE + "/unsubscribe?key=" + encodeURIComponent(KEY), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ channel_id: n.channelId, side }),
    });
    const out = await res.json().catch(() => null);
    if (!res.ok || !out || !out.ok) throw new Error((out && out.error) || "HTTP " + res.status);
    doneUnsub.set(k, side === "pipeline" ? "✓ nuggets unsubbed"
      : (out.already ? "✓ was not subscribed" : "✓ YouTube unsubbed"));
    render();
  } catch (e) {
    render();
    alert("Unsubscribe failed: " + e.message);
  }
}

async function setPhrase(vid, restart) {
  const n = all.find(x => x.video_id === vid && x.campaignId != null && x.campaignQuery);
  const b = document.getElementById("sp-" + vid);
  if (!n) return;
  if (b) { b.disabled = true; b.textContent = "…"; }
  try {
    const res = await fetch(BASE + (restart ? "/restart-phrase" : "/stop-phrase") + "?key=" + encodeURIComponent(KEY), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ campaign_id: n.campaignId, query: n.campaignQuery }),
    });
    const out = await res.json().catch(() => null);
    if (!res.ok || !out || !out.ok) throw new Error((out && out.error) || "HTTP " + res.status);
    phraseStatus[n.campaignId + "|" + n.campaignQuery] =
      restart ? { active: true, stopped_at: null } : { active: false, stopped_at: new Date().toISOString() };
    render();  // every header sharing the phrase updates together
  } catch (e) {
    if (b) { b.disabled = false; b.textContent = restart ? "restart?" : "✗ stop phrase"; }
    alert((restart ? "Restart" : "Stop") + " phrase failed: " + e.message);
  }
}

// Second-dimension stripe: the sort carries one score, the colored left edge
// carries the one it ISN'T showing (green >=75, gold >=85).
function stripeDim() {
  return (state.sort === "broccoli" || state.sort === "coach") ? "appeal" : "coach";
}
function stripeClass(n) {
  const s = stripeDim() === "appeal" ? n.personal_score : n.expert_score;
  return s >= 85 ? " hot2" : s >= 75 ? " hot1" : "";
}

const PICKLE_ACK = "pickled — hidden from the default view (kept; find it under Rating → Pickled) · tap the same star again to undo";

function card(n) {
  const open = n.id === openId;
  const isPost = isPostSource(n);
  const start = displayStart(n);
  const link = isPost ? (n.contentUrl || "#")
    : "https://www.youtube.com/watch?v=" + n.video_id + (start != null ? "&t=" + start + "s" : "");
  const watchLabel = isPost ? "&#128214; Open post"
    : start != null ? "&#9654; Watch at " + fmtT(start) : "&#9654; Watch now";
  const ex = expiry(n);
  const toast = toasts.get(n.id);
  return '<div class="card' + (open ? " open" : "") + (n.playedAt ? " played" : "") + (PL.items[PL.idx] && PL.items[PL.idx].id === n.id ? " now" : "") + stripeClass(n) + '" id="card-' + n.id + '">' +
    '<div class="hl" onclick="toggle(\'' + n.id + '\')">' + esc(n.headline || (n.content || "").slice(0, 110) || "(untitled nugget)") + "</div>" +
    '<div class="meta">' +
      "<b>" + esc(n.channelLabel) + "</b>" +
      "<span>" + fmtD(n.publishedAt || n.created_at) + "</span>" +
      (n.domain ? '<span class="chip">' + esc(n.domain) + "</span>" : "") +
      categoriesOf(n).map(c => '<span class="chip">' + esc(c) + "</span>").join("") +
      (ex ? '<span class="chip exp" title="unrated and older than this tag\'s TTL">expired: ' + esc(ex.tag) + " " + ex.days + "d</span>" : "") +
      (isPost ? '<span class="chip">' + esc(n.source) + "</span>" : "") +
      (n.sourceKey && n.sourceKey.endsWith("_manual")
        ? '<span class="chip" style="color:var(--accent)">manual add</span>' : "") +
      campaignChips(n) +
      scoreStrip(n) +
      (n.rating ? '<span class="chip" style="color:var(--gold)">&#9733;' + n.rating + "</span>" : "") +
      (n.playedAt ? '<button class="chip" style="border:none;cursor:pointer;color:var(--dim)" title="a list renderer finished this — tap to mark unplayed" onclick="togglePlayed(\'' + n.id + '\')">played</button>' : "") +
      listButtons(n) +
      '<button class="lb kb' + (n.keeperAt ? " on" : "") + '" title="Keeper: I expect to use this idea near or mid-term' + (n.keeperAt ? " — tap to clear" : "") + '" onclick="setKeeper(\'' + n.id + "')\">K</button>" +
    "</div>" +
    (toast ? '<div class="toast">' + toast + "</div>" : "") +
    '<div class="body">' +
      (n.content == null
        ? (bodiesInFlight.has(n.id)
          ? '<div class="content" style="color:var(--faint)">loading…</div>'
          : '<div class="content" style="color:var(--faint);cursor:pointer" onclick="retryBody(\'' + n.id + '\')">body not loaded — tap to retry</div>')
        : '<div class="content">' + esc(n.content) + "</div>" +
          (n.rationale ? '<div class="rationale">' + esc(n.rationale) + "</div>" : "")) +
      '<div class="actions">' +
        '<a class="watch" target="_blank" rel="noopener" href="' + link + '">' + watchLabel + "</a>" +
        '<div class="stars">' + [1,2,3,4,5].map(k =>
          '<button title="' + k + ' — ' + SCALE[k] + '" class="' + (n.rating >= k ? "lit" : "") + '" onclick="rate(\'' + n.id + '\',' + k + ')">&#9733;</button>'
        ).join("") + "</div>" +
      "</div>" +
      '<div class="rnote">' + rnote(n) + "</div>" +
    "</div></div>";
}

// Legend under the stars: the stars rate the abstract — the only rating.
function rnote(n) {
  const pre = n.campaignId ? "prospect · ratings teach the campaign<br>" : "";
  const lists = "A = listen · V = watch · R = read · K = keeper (dashed = suggested)";
  if (!n.rating) return pre + "stars rate the abstract · 1–2 pickles it (kept, hidden) · " + lists;
  return pre + "&#9733;" + n.rating + " — " + SCALE[n.rating] + " · " + lists;
}

function toggle(id) {
  openId = openId === id ? null : id;
  if (openId) ensureBodies([openId]); // normally already prefetched with its window
  render();
}

// A failed save must never look like a successful one.
async function post(path, body) {
  try {
    const res = await fetch(BASE + path + "?key=" + encodeURIComponent(KEY), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
  } catch (e) {
    alert("NOT SAVED (" + path + "): " + e.message +
      "\nThe change you just made was not stored - reload and retry.");
  }
}
async function rate(id, k) {
  const n = all.find(x => x.id === id);
  const next = n.rating === k ? null : k; // tap the same star again to clear
  n.rating = next; pinned.add(id);
  if (next != null && next <= 2) toasts.set(id, PICKLE_ACK); else toasts.delete(id);
  render();
  await post("/rate", { id, rating: next });
}
// Keeper (§13.3): a disposition after consuming; separate from the stars.
async function setKeeper(id) {
  const n = all.find(x => x.id === id);
  n.keeperAt = n.keeperAt ? null : new Date().toISOString();
  pinned.add(id); render();
  await post("/keeper", { id, keeper: !!n.keeperAt });
}
// Tap the "played" chip to mark unplayed (Mike, 2026-08-23).
async function togglePlayed(id) {
  const n = all.find(x => x.id === id);
  n.playedAt = null;
  pinned.add(id); render();
  await post("/played", { id, played: false });
}
// Played (§13.4): stamped by the renderer that finished the item.
async function markPlayed(n) {
  if (!n || n.playedAt) return;
  n.playedAt = new Date().toISOString();
  pinned.add(n.id);
  await post("/played", { id: n.id, played: true });
}
// One list per nugget: tapping the list it is on clears it; another moves it.
async function setList(id, key) {
  const n = all.find(x => x.id === id);
  const next = n.queueList === key ? null : key;
  n.queueList = next; n.queuedAt = next ? new Date().toISOString() : null;
  pinned.add(id); render();
  await post("/queued", { id, list: next });
}

// Pace = (used/quota) / elapsed-fraction, colored like the ops burn cards.
function paceHtml(used, quota, elapsed, limiter) {
  if (!quota || !elapsed) return "";
  const r = (used / quota) / Math.max(elapsed, 0.02);
  const cls = r < 0.5 ? "p-blue" : r <= 1 ? "p-green" : r <= 1.3 ? "p-yellow" : "p-red";
  return ' <span class="' + cls + '">' + r.toFixed(1) + "&times; pace</span> <span style=\"opacity:.75\">(" + limiter + ")</span>";
}

// The status strip is visible only while the list needs a refresh (at open
// and after a Scope/Source change — i.e. while Apply shows) and hidden after
// a load, to give the screen back (Mike, 2026-08-23). Data arrives with
// /facets (and again with each /data).
let lastStatus = null;
function statusVisibility() {
  const el = document.getElementById("status");
  const show = applyPending() && lastStatus && el.className !== "";
  el.style.display = show ? "block" : "none";
}
function renderStatus(s) {
  const el = document.getElementById("status");
  if (!s) return;
  lastStatus = s;
  if (s.alarms && s.alarms.length) {
    el.className = "alarm";
    el.textContent = "⚠ " + s.alarms.join(" · ");
  } else {
    const bits = [];
    if (s.mtd_cost_usd != null) {
      const d = new Date();
      const monthFrac = d.getDate() / new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      bits.push("$" + Number(s.mtd_cost_usd).toFixed(2) +
        paceHtml(Number(s.mtd_cost_usd), s.claude_budget_usd, monthFrac, "soft $ budget"));
    }
    if (s.supadata) {
      bits.push("pulls " + s.supadata.mtd_calls + "/" + s.supadata.allotment +
        paceHtml(s.supadata.mtd_calls, s.supadata.allotment, s.supadata.cycle_fraction, "Supadata cycle"));
    }
    if (s.drift && s.drift.detail) bits.push(s.drift.breach ? "drift: watch" : "drift ok");
    if (!bits.length) return;
    el.className = "quiet";
    el.innerHTML = "✓ " + bits.join(" &nbsp;·&nbsp; ");
  }
  statusVisibility();
}

function applyZoom() { document.body.style.zoom = state.zoom || 1; }
function zoomStep(dir) {
  const z = (state.zoom || 1) * (dir > 0 ? 1.2 : 1 / 1.2);
  state.zoom = Math.round(Math.min(2.5, Math.max(0.58, z)) * 100) / 100;
  save(); applyZoom();
}

// Tier 1: facets only — the header paints at once; nothing else loads.
async function load() {
  if (!KEY) {
    document.getElementById("list").innerHTML =
      '<div class="empty">Missing ?key= in the URL — open this page from your bookmark once; this device remembers it afterwards.</div>';
    return;
  }
  // Old saved Source values (channel labels) predate the ch:<id> encoding.
  if (state.src && !/^(ch|c|q):/.test(state.src)) state.src = "";
  applyZoom();
  // Paint from the last facets this device saw (instant, even on a cold
  // function — the first call after idle measured 2.5 s vs 0.9 s warm,
  // 2026-08-23), then refresh in the background.
  try { const c = localStorage.getItem("ytr3_facets"); if (c) facets = JSON.parse(c); } catch (e) {}
  render();
  let res;
  try { res = await fetch(BASE + "/facets?key=" + encodeURIComponent(KEY)); }
  catch (e) { if (!facets) document.getElementById("list").innerHTML = '<div class="empty">Could not reach the nugget API.</div>'; return; }
  if (!res.ok) {
    if (!facets) document.getElementById("list").innerHTML =
      '<div class="empty">API error ' + res.status + (res.status === 401 ? " — key rejected." : "") + "</div>";
    return;
  }
  facets = await res.json();
  try { localStorage.setItem("ytr3_facets", JSON.stringify(facets)); } catch (e) {}
  renderStatus(facets.status);
  render();
}

// Tier 2: the chosen Scope+Source subset's metadata index (Apply).
async function loadData() {
  const sel = { scope: state.scope || "", src: state.src || "" };
  loading = true; render();
  let res;
  try {
    res = await fetch(BASE + "/data?key=" + encodeURIComponent(KEY) +
      "&scope=" + encodeURIComponent(sel.scope || "all") + "&source=" + encodeURIComponent(sel.src));
  } catch (e) {
    loading = false; render();
    document.getElementById("list").innerHTML = '<div class="empty">Could not reach the nugget API.</div>';
    return;
  }
  if (!res.ok) {
    loading = false; render();
    document.getElementById("list").innerHTML =
      '<div class="empty">API error ' + res.status + (res.status === 401 ? " — key rejected." : "") + "</div>";
    return;
  }
  const data = await res.json();
  loading = false;
  renderStatus(data.status);
  manualEmpty = data.manual_empty || [];
  phraseStatus = data.phrase_status || {};
  catTtls = data.category_ttls || {};
  defaultTtl = data.default_ttl_days || 180;
  // Normalized payload (2026-08-23): video metadata ships ONCE in
  // data.videos keyed by video_id; the per-nugget embed is tolerated as a
  // fallback for an older function build.
  const videos = data.videos || {};
  all = (data.nuggets || []).map(n => {
    const v = n.yt_videos || videos[n.video_id] || {};
    return {
      ...n,
      channelLabel: v.yt_channels?.label || v.channel_id || "?",
      channelId: v.channel_id || null,
      videoTitle: v.title || "",
      plainTitle: v.plain_title || "",
      hypeLevel: v.hype_level ?? null,
      campaignId: v.campaign_id ?? null,
      source: v.source || "youtube",
      sourceKey: v.source_key || null,
      discoveredAt: v.discovered_at || null,
      manualAddedAt: v.manual_added_at || null,
      generation: v.generation ?? 1,
      contentUrl: v.url || null,
      campaignName: v.yt_campaigns?.name ?? null,
      campaignQuery: (data.campaign_queries || {})[n.video_id] ?? null,
      publishedAt: v.published_at,
      durationSeconds: v.duration_seconds ?? null,
      viewCount: v.view_count ?? null,
      needsViz: n.needs_viz ?? null,
      queuedAt: n.queued_at || null,
      queueList: n.queue_list || null,
      playedAt: n.played_at || null,
      keeperAt: n.keeper_at || null,
      extra: !!n.extra,            // ride-along listed item outside the loaded scope (§13.2)
      media: v.media || null,      // attached media record (§13.1)
      reviewedAt: n.reviewed_at || null,
    };
  });
  vizHi = Number.isFinite(Number(data.viz_hi)) ? Number(data.viz_hi) : 70;
  vizLo = Number.isFinite(Number(data.viz_lo)) ? Number(data.viz_lo) : 30;
  clipLen = Number(data.clip_default_seconds) || 120;
  speechWpm = Number(data.speech_wpm) || 155;
  // Tier-2 (spec §9): default voice trio, rendered-unit keys, playlists.
  if (data.tts) ttsInfo = data.tts;
  ttsRendered = new Set(data.tts_rendered || []);
  playlists = data.playlists || [];
  if (facets) facets.audio_playlist_id = data.audio_playlist_id || facets.audio_playlist_id || "";
  byId = new Map(all.map(n => [n.id, n]));
  channelHype = new Map((data.channel_hype || []).map(c => [c.label, c.avg_hype]));
  regress();
  // Category vocabulary: server-known tags first (TTL seed order), then
  // anything present only in the data (legacy pseudo-tags), alphabetical.
  const seen = new Set(all.flatMap(n => categoriesOf(n)));
  catList = Object.keys(catTtls).filter(c => seen.has(c))
    .concat([...seen].filter(c => !(c in catTtls)).sort());
  loadedSel = sel;
  pinned.clear(); toasts.clear(); paintLimit = WINDOW; openId = null; gToggled = new Set();
  render();
}
load();
</script>
